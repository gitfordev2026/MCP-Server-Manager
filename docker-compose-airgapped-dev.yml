# ==========================================================================
# MCP SERVER MANAGER - AIRGAPPED DEVELOPMENT DOCKER COMPOSE MANIFEST
# ==========================================================================
# Bound to IP: 10.196.167.176
# Confidential Keycloak + Redis + Dynamic Inference Engine
# ==========================================================================

services:
  redis:
    image: redis:alpine
    container_name: mcp-redis-dev
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - mcp-airgapped-dev-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: mcp-backend:airgapped-dev
    container_name: mcp-backend-dev
    ports:
      - "8000:8000"
      - "8099:8099"
    volumes:
      - ./backend/app:/app
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_SERVER_URL=http://10.196.167.176:8080
      - KEYCLOAK_FRONTEND_URL=http://10.196.167.176:8080
      - KEYCLOAK_REALM=IAF
      - KEYCLOAK_CLIENT_ID=mcp-client-secure
      - KEYCLOAK_CLIENT_SECRET=ZkDIyMqzv0kJUe90tjKEvX3jwGZB3ACHS9hpJO0y3i9vteYNAfc9ngI8ga2cwSNucAjpEG7re3864gxrygGkAG
      - ENABLE_MULTI_KEYCLOAK=false
      - AGENT_OLLAMA_BASE_URL=http://10.196.167.176:11434
      - INFERENCE_ENGINE_OPENAPI_URL=http://10.196.167.176:11434
      - INFERENCE_ENGINE_API_KEY=dummy_api_key_12345
      - AGENT_MCP_SERVER_URL=http://10.196.167.176:8000/mcp/apps/
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mcp-airgapped-dev-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: mcp-frontend:airgapped-dev
    container_name: mcp-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_BE_API_URL=http://10.196.167.176:8000
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-airgapped-dev-net

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile.dev
    image: mcp-mock-server:airgapped-dev
    container_name: mcp-mock-dev
    ports:
      - "8001:8001"
    volumes:
      - ./mock-mcp-server:/app
    environment:
      - ENV=development
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-airgapped-dev-net

networks:
  mcp-airgapped-dev-net:
    driver: bridge
