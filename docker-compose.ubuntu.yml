# ==========================================================================
# MCP SERVER MANAGER - UBUNTU / LINUX DOCKER COMPOSE MANIFEST
# Optimized for Ubuntu / Debian / RHEL / CentOS (Native Docker Engine)
# ==========================================================================
# Usage on Ubuntu Terminal:
#   docker compose -f docker-compose.ubuntu.yml up -d
# ==========================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-backend:ubuntu
    container_name: mcp-backend-ubuntu
    ports:
      - "8000:8000"
      - "8099:8099"
    volumes:
      - ./backend/app:/app:rw
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=mcp-realm
      - KEYCLOAK_CLIENT_ID=mcp_secure1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-ubuntu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: mcp-frontend:ubuntu
    container_name: mcp-frontend-ubuntu
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BE_API_URL=http://localhost:8000
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-ubuntu-network

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile
    image: mcp-mock-server:ubuntu
    container_name: mcp-mock-ubuntu
    ports:
      - "8001:8001"
    volumes:
      - ./mock-mcp-server:/app:rw
    environment:
      - ENV=development
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-ubuntu-network

networks:
  mcp-ubuntu-network:
    driver: bridge
