# ==========================================================================
# MCP SERVER MANAGER - UNIVERSAL DOCKER COMPOSE MANIFEST
# Compatible with both Windows (Docker Desktop / WSL2) and Ubuntu / Linux
# ==========================================================================
# Code is mounted live from host folders for instant hot-reloading:
#   - ./backend/app -> /app (FastAPI Gateway)
#   - ./frontend -> /app (Next.js Dashboard)
#   - ./mock-mcp-server -> /app (Mock REST Server)
# ==========================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-backend:latest
    container_name: mcp-backend
    ports:
      - "8000:8000"
      - "8099:8099"
    volumes:
      - ./backend/app:/app
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=mcp-realm
      - KEYCLOAK_CLIENT_ID=mcp_secure1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: mcp-frontend:latest
    container_name: mcp-frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount host source code into container
      - ./frontend:/app
      # Prevent host OS node_modules & .next from overwriting container build
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_BE_API_URL=http://localhost:8000
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile
    image: mcp-mock-server:latest
    container_name: mcp-mock-server
    ports:
      - "8001:8001"
    volumes:
      - ./mock-mcp-server:/app
    environment:
      - ENV=development
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
