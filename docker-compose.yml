# MCP SERVER MANAGER - UNIVERSAL DOCKER COMPOSE MANIFEST
# Compatible with both Windows (Docker Desktop / WSL2) and Ubuntu / Linux
# ==========================================================================
# Bound to IP: 10.196.167.176
# Confidential Keycloak + Redis + Dynamic Inference Engine
# ==========================================================================

services:
  # redis:
  #   image: redis:alpine
  #   container_name: mcp-redis-uni
  #   ports:
  #     - "6380:6379"
  #   restart: unless-stopped
  #   networks:
  #     - mcp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: mcp-backend:latest
    container_name: mcp-backend
    network_mode: host
    ports:
      - "8000:8000"
      - "8099:8099"
    volumes:
      - ./backend/app:/app
    env_file:
      - ./backend/app/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   - redis
    restart: unless-stopped
    # networks:
    #   - mcp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: mcp-frontend:latest
    container_name: mcp-frontend
    network_mode: host
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # environment:
      # - NEXT_PUBLIC_BE_API_URL=http://backend:8000
    env_file:
      - ./frontend/.env
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - mcp-network

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile.dev
    image: mcp-mock-server:latest
    container_name: mcp-mock-server
    network_mode: host
    ports:
      - "8001:8001"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - mcp-network

  mock-inventory-app:
    image: mcp-mock-server:latest
    container_name: mcp-inventory-app
    network_mode: host
    ports:
      - "8002:8002"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn inventory_app:app --host 0.0.0.0 --port 8002 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - mcp-network

  mock-portal-app:
    image: mcp-mock-server:latest
    container_name: mcp-portal-app
    network_mode: host
    ports:
      - "8003:8003"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn portal_app:app --host 0.0.0.0 --port 8003 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
      # - mcp-network

  mock-analytics-app:
    image: mcp-mock-server:latest
    container_name: mcp-analytics-app
    network_mode: host
    ports:
      - "8004:8004"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn analytics_app:app --host 0.0.0.0 --port 8004 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - mcp-network

