# ==========================================================================
# MCP SERVER MANAGER - UNIVERSAL DOCKER COMPOSE MANIFEST
# Compatible with both Windows (Docker Desktop / WSL2) and Ubuntu / Linux
# ==========================================================================
# Code is mounted live from host folders for instant hot-reloading:
#   - ./backend/app -> /app (FastAPI Gateway)
#   - ./frontend -> /app (Next.js Dashboard)
#   - ./mock-mcp-server -> /app (Mock REST Server)
# ==========================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-backend:latest
    container_name: mcp-backend
    ports:
      - "8000:8000"
      - "8099:8099"
    volumes:
      - ./backend/app:/app
    env_file:
      - ./backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: mcp-frontend:latest
    container_name: mcp-frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount host source code into container
      - ./frontend:/app
      # Prevent host OS node_modules & .next from overwriting container build
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile
    image: mcp-mock-server:latest
    container_name: mcp-mock-server
    ports:
      - "8001:8001"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  mock-inventory-app:
    image: mcp-mock-server:latest
    container_name: mcp-inventory-app
    ports:
      - "8002:8002"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn inventory_app:app --host 0.0.0.0 --port 8002 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  mock-portal-app:
    image: mcp-mock-server:latest
    container_name: mcp-portal-app
    ports:
      - "8003:8003"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn portal_app:app --host 0.0.0.0 --port 8003 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

  mock-analytics-app:
    image: mcp-mock-server:latest
    container_name: mcp-analytics-app
    ports:
      - "8004:8004"
    volumes:
      - ./mock-mcp-server:/app
    env_file:
      - ./mock-mcp-server/.env
    command: uvicorn analytics_app:app --host 0.0.0.0 --port 8004 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
