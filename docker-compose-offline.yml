# ==========================================================================
# MCP SERVER MANAGER - 100% AIRGAPPED & OFFLINE DOCKER COMPOSE MANIFEST
# ==========================================================================
# Bound to IP: 10.196.167.176
# Confidential Keycloak + Redis + Dynamic Inference Engine
# ==========================================================================

services:
  redis:
    image: redis:alpine
    container_name: mcp-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - mcp-internal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-backend:airgapped
    container_name: mcp-backend
    ports:
      - "8000:8000"
      - "8099:8099"
    environment:
      - ENV=production
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_SERVER_URL=http://10.196.167.176:8080
      - KEYCLOAK_FRONTEND_URL=http://10.196.167.176:8080
      - KEYCLOAK_REALM=IAF
      - KEYCLOAK_CLIENT_ID=mcp-client-secure
      - KEYCLOAK_CLIENT_SECRET=ZkDIyMqzv0kJUe90tjKEvX3jwGZB3ACHS9hpJO0y3i9vteYNAfc9ngI8ga2cwSNucAjpEG7re3864gxrygGkAG
      - ENABLE_MULTI_KEYCLOAK=false
      - AGENT_OLLAMA_BASE_URL=http://10.196.167.176:11434
      - INFERENCE_ENGINE_OPENAPI_URL=http://10.196.167.176:11434
      - INFERENCE_ENGINE_API_KEY=dummy_api_key_12345
      - AGENT_MCP_SERVER_URL=http://10.196.167.176:8000/mcp/apps/
    volumes:
      - ./backend/app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mcp-internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mcp-frontend:airgapped
    container_name: mcp-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BE_API_URL=http://10.196.167.176:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-internal-net

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile
    image: mcp-mock-server:airgapped
    container_name: mcp-mock-server
    ports:
      - "8001:8001"
    environment:
      - ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-internal-net

networks:
  mcp-internal-net:
    driver: bridge
