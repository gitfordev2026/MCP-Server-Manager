# ==========================================================================
# MCP SERVER MANAGER - 100% AIRGAPPED & OFFLINE DOCKER COMPOSE MANIFEST
# ==========================================================================
# This manifest allows running the entire MCP Server Manager platform in an
# airgapped / offline environment with zero outbound internet access.
# ==========================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mcp-backend:airgapped
    container_name: mcp-backend
    ports:
      - "8000:8000"
      - "8099:8099"
    environment:
      - ENV=production
      - KEYCLOAK_URL=http://host.docker.internal:8080
      - KEYCLOAK_REALM=mcp-realm
      - KEYCLOAK_CLIENT_ID=mcp_secure1
      - ENABLE_MULTI_KEYCLOAK=false
    volumes:
      - ./backend/app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mcp-frontend:airgapped
    container_name: mcp-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BE_API_URL=http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-internal-net

  mock-server:
    build:
      context: ./mock-mcp-server
      dockerfile: Dockerfile
    image: mcp-mock-server:airgapped
    container_name: mcp-mock-server
    ports:
      - "8001:8001"
    environment:
      - ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - mcp-internal-net

networks:
  mcp-internal-net:
    driver: bridge
